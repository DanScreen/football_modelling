name: Deploy to Cloud Run

on:
  # main only. Deploying from more than one branch let a push to main ship a
  # build without the Scorers submission routes that had only reached
  # deploy_to_gcp, so the scheduler jobs started getting 404s.
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  SERVICE: football-api
  ARTIFACT_REPO: football-api

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPO}/${SERVICE}:${GITHUB_SHA}"
          docker build -t "$IMAGE" -t "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPO}/${SERVICE}:latest" .
          docker push "$IMAGE"
          docker push "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPO}/${SERVICE}:latest"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}
          # Keep in step with `timeout` in terraform/main.tf. Set here too so the
          # value is applied on every deploy, not only after a terraform apply.
          flags: --timeout=900

      - name: Show service URL
        run: gcloud run services describe ${{ env.SERVICE }} --region ${{ env.GCP_REGION }} --format='value(status.url)'
